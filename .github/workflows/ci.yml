name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.repository == 'wideeyephoto/lets-get-quoted'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3010
      NEXT_PUBLIC_ROOT_DOMAIN: letsgetquoted.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      # Coverage rather than a bare `vitest run`: it is the same single pass over
      # the same suite, and it is what lets the thresholds in vitest.config.ts
      # bite. A floor nothing evaluates is the problem the audit found everywhere
      # else, not a fix for it.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Office Data API boundary on PostgreSQL 17
        run: npm run test:pg17:job-access

      - name: Account closure domain database checks
        run: npm run test:pg17:closure-domains

      - name: SEO tests
        run: npm run test:seo

      - name: Overage reconciliation tests
        run: npm run test:overage-reconciliation

      - name: Stock image tests
        run: npm run test:stock

      # Three checks that already existed, already passed, and nothing ran. The
      # untested-code audit found 70 of 76 test and verification scripts absent
      # from CI; these three cost under two seconds between them, so there was
      # no trade to weigh. See docs/untested-code-audit-2026-09-12.md.
      - name: Schema foreign-key ordering
        run: npm run check:schema:order

      - name: Messaging schema parity with runtime migrations
        run: npm run check:schema:messaging

      - name: Incident rehearsal cycle
        run: npm run test:incident-rehearsal

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
