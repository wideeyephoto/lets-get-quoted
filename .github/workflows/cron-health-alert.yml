name: Cron Health Monitor & Alerting

on:
  schedule:
    # Run every 30 minutes to ensure automated alerting on silent or failing cron workers
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  cron-health:
    if: github.repository == 'wideeyephoto/lets-get-quoted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Cron Health (90-minute window)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/inspect-cron-health.mjs 90 --strict
