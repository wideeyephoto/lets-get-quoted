name: Cron Health Monitor & Alerting

on:
  schedule:
    # Independent watchdog; Vercel also runs the same monitor every five minutes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: operational-monitor
  cancel-in-progress: false

jobs:
  cron-health:
    if: github.repository == 'wideeyephoto/lets-get-quoted'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ONCALL_PRIMARY_PHONE: ${{ secrets.ONCALL_PRIMARY_PHONE }}
      OPERATIONAL_SMS_FROM_NUMBER: ${{ secrets.OPERATIONAL_SMS_FROM_NUMBER }}
      SIGNALWIRE_SPACE_URL: ${{ secrets.SIGNALWIRE_SPACE_URL }}
      SIGNALWIRE_PROJECT_ID: ${{ secrets.SIGNALWIRE_PROJECT_ID }}
      SIGNALWIRE_API_TOKEN: ${{ secrets.SIGNALWIRE_API_TOKEN }}
      FOUNDER_ALERT_EMAIL: hello@letsgetquoted.com
      SYSTEM_EMAIL_FROM: "Let's Get Quoted Ops <system@letsgetquoted.com>"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect failures and verify notification delivery
        run: node scripts/monitor-operations.mjs
      - name: Page if the monitor or its dependency installation failed
        if: failure()
        run: node scripts/page-monitor-failure.mjs
